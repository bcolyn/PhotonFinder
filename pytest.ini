[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore:pkg_resources is deprecated as an API.*:DeprecationWarning
    ignore:.*declare_namespace.*:DeprecationWarning
    ignore::DeprecationWarning:pkg_resources

# Display more detailed test information, skip slow, internet and end-to-end GUI tests
addopts = -v  -m "not slow and not internet and not e2e"

# Ignore certain directories
norecursedirs = .* build dist venv .venv __pycache__

env_files = local.env

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    internet: marks tests that require internet access (deselect with '-m "not internet"')
    e2e: end-to-end GUI tests in tests/e2e, marked automatically (run with '-m e2e')