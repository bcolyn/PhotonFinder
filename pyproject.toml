[project]
name = "PhotonFinder"
version = "2.0.0"
description = "Desktop application for managing astronomical files"
readme = "Readme.md"
authors = [
    { name = "Benny Colyn", email = "benny.colyn@gmail.com" }
]
license = "MIT"

# Not 3.14 yet: pytest-qt 4.5.0 does not support it and crashes the test process.
requires-python = ">=3.13"

# Ranges here, exact versions in uv.lock. An exact pin needs a reason next to it.
dependencies = [
    "pyside6~=6.12.0",
    "peewee~=4.5.3",
    "astropy~=8.0.2",
    "astropy-healpix~=2.0.1",
    "astroquery~=0.4.11",
    "photutils~=3.1.1",
    "sep>=1.4.0",
    "xisf~=0.9.7",
    # 1.5.7.3 was yanked upstream: not threadsafe.
    "zstd==1.5.7.2",
    "fs~=2.4.16",
    "numpy~=2.5.4",
    "pillow~=13.0.0",
    "psutil~=7.2.0",
    "requests~=2.34.2",
    "opencv-python~=5.0.0.93",
    "timezonefinder~=9.2.0",
    # Not imported: the time zone database zoneinfo needs on Windows.
    "tzdata",
    # 2.x removed FastMCP; moving to it means migrating mcp_server.py.
    "mcp~=1.2",
    "anyio~=4.13",
    "pydantic~=2.13",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
    "pytest-dotenv>=0.5.2",
    "pytest-qt>=4.5.0",
    "pytest-mock~=3.17",
    "pytest-cov~=7.1",
    "huggingface-hub>=1.20.1",
    "ipython~=9.18",
    "pylint~=4.1",
]
build = [
    "pyinstaller~=6.22.3",
    "pyinstaller-hooks-contrib>=2026.9",
    # Required during PyInstaller analysis: astropy/photutils submodules import
    # matplotlib at collection time, causing a startup failure if it's absent.
    # It is excluded from the bundle via photonfinder.spec; only needed at build time.
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
# fs imports pkg_resources, which newer setuptools no longer ships.
constraint-dependencies = ["setuptools<81"]

[tool.pylint.main]
# Generated code: ui/generated by scripts/build_ui.py, mcp_manifest.py by scripts/build_mcp_manifest.py.
ignore-paths = [
    '^photonfinder[/\\]ui[/\\]generated[/\\].*$',
    '^photonfinder[/\\]mcp_manifest\.py$',
]
# Load compiled extensions so pylint can see their members instead of reporting no-member.
extension-pkg-allow-list = ["PySide6", "cv2", "zstd", "sep"]
jobs = 0

[tool.pylint.typecheck]
# Peewee's database_required adds the optional database argument and classmethod_only wraps
# Model.delete & co.; without these pylint reports no-value-for-parameter on every query.
signature-mutators = ["peewee.database_required", "peewee.classmethod_only"]
# Members pylint can't infer:
#  - Qt signals: PySide6 Signal descriptors show up as functions without connect/emit.
#  - astropy.units: the unit names are injected into the module namespace at import time.
#  - Peewee: _meta, DoesNotExist and <fk>_id accessors are added by the model metaclass.
#  - Settings: get_/set_ accessors are generated from Settings._SPECS (core.py).
#  - astropy: hdul[0] is inferred as HDUList (slicing returns one) instead of an HDU.
#  - cv2: the members live in a native submodule pylint doesn't load through the package.
# Each pattern is matched (from the start) against the attribute name, the source expression
# and the owner's qualified type name.
generated-members = [
    "(connect|disconnect|emit)$",
    "astropy\\.units\\..*",
    "u\\.[A-Za-z_]+$",
    ".*\\.HDUList\\.(data|header)$",
    "cv2\\..*",
    "_meta$",
    "DoesNotExist$",
    "[A-Z][A-Za-z]*\\.[a-z_]+_id$",
    "photonfinder\\.core\\.Settings\\.(get|set)_.*",
]

[tool.pylint."messages control"]
# The baseline is correctness findings. Off for now, to revisit later:
#  - C/R: style, naming, docstrings, too-many-*.
#  - broad-exception-caught: background jobs and UI handlers log and carry on by design.
#  - logging-fstring-interpolation: f-strings in log calls are the codebase's style.
#  - unused-argument: Qt slots and callbacks have fixed signatures.
#  - protected-access: Peewee's public API includes Model._meta.
disable = [
    "C",
    "R",
    "fixme",
    "broad-exception-caught",
    "logging-fstring-interpolation",
    "unused-argument",
    "protected-access",
]
